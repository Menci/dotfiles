{{- /* chezmoi:modify-template */ -}}
{{- /*
  Codex owns provider configuration, project trust, and generated state in this
  file. Replace only captured preference assignments so their surrounding
  comments, tables, and machine-local values survive application rewrites.
*/ -}}
{{- $eol := "\n" -}}
{{- if contains "\r\n" .chezmoi.stdin -}}
{{- $eol = "\r\n" -}}
{{- end -}}
{{- $output := .chezmoi.stdin -}}
{{- range $spec := .agentPreferences.codex -}}
{{- $parsed := fromToml $output -}}
{{- $table := $parsed -}}
{{- range $part := $spec.path -}}
{{- if hasKey $table $part -}}
{{- $table = index $table $part -}}
{{- if not (kindIs "map" $table) -}}
{{- fail (printf "%s is not a TOML table" $spec.header) -}}
{{- end -}}
{{- else -}}
{{- $table = dict -}}
{{- end -}}
{{- end -}}
{{- $section := "" -}}
{{- $prefix := "" -}}
{{- $exists := eq $spec.header "" -}}
{{- if $exists -}}
{{- $section = regexFind `(?s)\A.*?(?:\n\[|\z)` $output -}}
{{- if hasPrefix "[" $output -}}
{{- $section = "[" -}}
{{- end -}}
{{- else -}}
{{- $headerPattern := printf `(?m)^%s[ \t]*(?:#[^\r\n]*)?\r?$` (regexQuoteMeta $spec.header) -}}
{{- $headers := regexFindAll $headerPattern $output -1 -}}
{{- if gt (len $headers) 1 -}}
{{- fail (printf "multiple %s tables" $spec.header) -}}
{{- end -}}
{{- $exists = eq (len $headers) 1 -}}
{{- if $exists -}}
{{- $section = regexFind (printf `(?ms)^%s[ \t]*(?:#[^\r\n]*)?(?:\r?\n|\z).*?(?:^\[|\z)` (regexQuoteMeta $spec.header)) $output -}}
{{- $prefix = regexFind `\A[^\r\n]*(?:\r?\n|\z)` $section -}}
{{- else if gt (len $table) 0 -}}
{{- fail (printf "unsupported TOML declaration for %s" $spec.header) -}}
{{- end -}}
{{- end -}}
{{- $hasNext := hasSuffix "[" $section -}}
{{- $body := trimPrefix $prefix (trimSuffix "[" $section) -}}
{{- range $key, $value := $spec.values -}}
{{- if or (not (hasKey $table $key)) (ne (toJson (index $table $key)) (toJson $value)) -}}
{{- $keyPattern := printf `(?:%s|"%s"|'%s')` (regexQuoteMeta $key) (regexQuoteMeta $key) (regexQuoteMeta $key) -}}
{{- $assignment := (dict $key $value | toToml | trimSuffix "\n" | replace "\n" $eol) -}}
{{- if hasKey $table $key -}}
{{- $span := regexFind (printf `(?ms)^[ \t]*%s[ \t]*=[ \t]*(?:\[[^\]]*\][ \t]*(?:#[^\r\n]*)?|[^\r\n]*)(?:\r?\n|\z)` $keyPattern) $body -}}
{{- if or (eq $span "") (contains `'''` $span) (contains `"""` $span) -}}
{{- fail (printf "unsupported assignment for %s %s" $spec.header $key) -}}
{{- end -}}
{{- $body = replace $span (printf "%s%s" $assignment $eol) $body -}}
{{- else -}}
{{- if and (ne $body "") (not (hasSuffix $eol $body)) -}}
{{- $body = printf "%s%s" $body $eol -}}
{{- end -}}
{{- $body = printf "%s%s%s" $body $assignment $eol -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if $exists -}}
{{- if and (ne $prefix "") (ne $body "") (not (hasSuffix $eol $prefix)) -}}
{{- $prefix = printf "%s%s" $prefix $eol -}}
{{- end -}}
{{- $replacement := printf "%s%s" $prefix $body -}}
{{- if $hasNext -}}
{{- $replacement = printf "%s[" $replacement -}}
{{- end -}}
{{- if eq $spec.header "" -}}
{{- $output = printf "%s%s" $replacement (trimPrefix $section $output) -}}
{{- else -}}
{{- $output = replace $section $replacement $output -}}
{{- end -}}
{{- else -}}
{{- if and (ne $output "") (not (hasSuffix $eol $output)) -}}
{{- $output = printf "%s%s" $output $eol -}}
{{- end -}}
{{- $output = printf "%s%s%s%s%s" $output $eol $spec.header $eol $body -}}
{{- end -}}
{{- end -}}
{{- $_ := fromToml $output -}}
{{- $output -}}
